    },
    bolt(cx, cy) {   // a storm: strobing white flashes and bolts striking down
      flash = { color: '#ffffff', a: 0.9, t: 0.2, dur: 0.2 };
      shakeUntil = performance.now() + 800;
      for (let k = 0; k < 4; k++) setTimeout(() => {
        flash = { color: k % 2 ? '#8fe6ff' : '#ffffff', a: 0.5, t: 0.12, dur: 0.12 };
        for (let i = 0; i < 3; i++) push({ kind: 'zap', x: R() * W, y: R() * H * 0.8, vx: 0, vy: 0, g: 0, r: 30 + R() * 40, rot: (R() - 0.5) * 0.6, color: i % 2 ? '#ffe14a' : '#fff', life: 0.6 });

    candy(cx, cy) {   // a candy pinata: sweets everywhere, pastel rings, sugar confetti

      setTimeout(() => { shower(50, 'confetti'); burst(30, 'candyp', cx, cy, 400, i => ({ color: ['#ff4fa3', '#5ee8b0', '#ffe14a'][i % 3], r: 6 + R() * 6, g: 800 })); go(); }, 400);
    },
    bell(cx, cy) {
      flash = { color: '#ffc14d', a: 0.5, t: 0.35, dur: 0.35 };
      shakeUntil = performance.now() + 900;
      for (let k = 0; k < 6; k++) rings.push({ x: cx, y: cy, r0: 30, r1: 420, w: 8, life: 1.1, age: -k * 0.18, color: k % 2 ? '#ffc14d' : '#ffffff' });
      for (let i = 0; i < 30; i++) push({ kind: 'bell', x: R() * W, y: -30 - R() * H * 0.5, vx: (R() - 0.5) * 60, vy: 60 + R() * 200, g: 450, r: 12 + R() * 10 });

  };

  /* ---------- ambient: each machine's idle weather, a few particles a second around the cabinet ----------

  let amb = null, ambAcc = 0, ambT = 0;
  const STAGE_RATE = [0, 0.55, 1, 1.7];
  const PASTEL = ['#ff4fa3', '#5ee8b0', '#ffe14a', '#2bd4ff', '#c79bff'];

  }
  const rx = (b) => b.x + R() * b.w, ry = (b) => b.y + R() * b.h;
  /* rate = particles per second at stage 2; spawn(b, st) pushes one or more particles. */
  const AMBIENT = {
    fruit: { rate: 1.1, spawn(b, st) {
      push({ kind: 'drop', x: rx(b), y: b.y + 4, vx: 0, vy: 20 + R() * 30, g: 60, r: 2.5 + R() * 2.5, sway: 14, color: FRUIT[Math.floor(R() * 5)], life: 2.4 });
      if (st === 3 && R() < 0.3) push({ kind: 'leaf', x: rx(b), y: b.y - 10, vx: (R() - 0.5) * 30, vy: 20, g: 25, r: 5, rot: R() * 6, vr: 2, sway: 40, color: R() < 0.5 ? '#a6ff4d' : '#2bd4ff', life: 3.5 });
    } },
    gem: { rate: 1.6, spawn(b, st) { push({ kind: 'shard', x: rx(b), y: ry(b), vx: (R() - 0.5) * 12, vy: -8 - R() * 14, g: 0, r: 1.8 + R() * (st === 3 ? 3 : 1.8), rot: R() * 6, vr: 2, color: GEM[Math.floor(R() * 6)], life: 1.8 + R() }); } },
    seven: { rate: 0.8, spawn(b, st) { push({ kind: st === 3 ? 'ember' : 'spark', x: rx(b), y: b.y + b.h - 8, vx: (R() - 0.5) * 30, vy: -40 - R() * 60, g: st === 3 ? -40 : 60, r: st === 3 ? 3 + R() * 3 : 2 + R() * 2, color: st === 3 ? '#2d86ff' : ['#fff', '#ff4040', '#ffe14a'][Math.floor(R() * 3)], life: 1.3 }); } },
    dice: { rate: 0.25, spawn(b, st) {
      if (st === 1) { push({ kind: 'shard', x: rx(b), y: ry(b), vx: 0, vy: -6, g: 0, r: 1.5, color: '#fff', life: 1.2 }); return; }
      if (st === 3) { push({ kind: 'coin', x: rx(b), y: b.y - 10, vx: (R() - 0.5) * 20, vy: 30, g: 400, r: 4 + R() * 3, rot: R() * 6, vr: 8, bounce: true, floor: b.y + b.h - 6, life: 2.6 }); return; }
      push({ kind: 'die', x: b.x - 10, y: b.y + 10 + R() * 30, vx: 60 + R() * 60, vy: -120 - R() * 60, g: 420, r: 6 + R() * 3, rot: R() * 6, vr: 7, color: R() < 0.5 ? '#ffffff' : '#e8204e', face: 1 + Math.floor(R() * 6), bounce: true, floor: b.y + b.h - 8, life: 3 });
    } },
    bandit: { rate: 0.45, spawn(b, st) {
      if (st === 3) { push({ kind: 'spark', x: rx(b), y: ry(b), vx: (R() - 0.5) * 200, vy: (R() - 0.5) * 200, g: 0, r: 2, color: R() < 0.5 ? '#ff1f3d' : '#2d86ff', life: 0.35 }); return; }
      push({ kind: 'bill', x: rx(b), y: b.y - 10, vx: (R() - 0.5) * 20, vy: 30 + R() * 20, g: 10, r: 6 + R() * 3, rot: R() * 6, vr: 1.5, sway: 40, life: 3.2 });
    } },
    bank: { rate: 0.7, spawn(b, st) {
      push({ kind: st === 3 && R() < 0.3 ? 'bar' : 'coin', x: rx(b), y: b.y - 10, vx: (R() - 0.5) * 20, vy: 20 + R() * 40, g: 420, r: 4 + R() * 3, rot: R() * 6, vr: 6, bounce: true, floor: b.y + b.h - 6, life: 2.8 });
    } },
    bell: { rate: 0.6, spawn(b, st) {
      if (st === 3) { rings.push({ x: b.x + b.w / 2, y: b.y + b.h * 0.45, r0: 40, r1: 60 + b.w * 0.9, w: 4, life: 1.6, age: 0, color: 'rgba(255,216,74,.5)' }); return; }
      push({ kind: 'note', x: b.x + b.w * (0.1 + R() * 0.8), y: b.y + b.h * 0.3, vx: (R() - 0.5) * 20, vy: -22 - R() * 16, g: 0, r: 5 + R() * 3, rot: (R() - 0.5) * 0.4, vr: 0.5, sway: 20, color: st === 2 ? '#ffe3b3' : '#ffc14d', life: 2.2 });
    } },
    bear: { rate: 0.8, spawn(b, st) {
      if (st === 3) { push({ kind: 'snow', x: rx(b), y: b.y - 6, vx: 0, vy: 18 + R() * 20, g: 0, r: 1.5 + R() * 2, sway: 16, color: 'rgba(255,255,255,.9)', life: 4 }); return; }
      if (st === 2 && R() < 0.3) { push({ kind: 'paw', x: rx(b), y: ry(b), vx: 0, vy: 0, g: 0, r: 5, rot: (R() - 0.5) * 1, color: 'rgba(58,28,6,.7)', life: 1.6 }); return; }
      push({ kind: 'leaf', x: rx(b), y: b.y - 8, vx: (R() - 0.5) * 20, vy: 24 + R() * 16, g: 10, r: 4 + R() * 2, rot: R() * 6, vr: 2.5, sway: 30, color: ['#35c24a', '#a6ff4d', '#d9823a'][Math.floor(R() * 3)], life: 3.4 });
    } },
    royal: { rate: 1.2, spawn(b, st) { push({ kind: 'shard', x: rx(b), y: ry(b), vx: 0, vy: -10 - R() * 10, g: 0, r: 1.6 + R() * (st === 3 ? 2.6 : 1.4), rot: R() * 6, vr: 3, color: st === 3 ? '#fff' : '#ffd84a', life: 1.6 + R() }); } },
    cat: { rate: 0.5, spawn(b, st) {
      if (st === 3) { push({ kind: 'shard', x: rx(b), y: ry(b), vx: 0, vy: -8, g: 0, r: 2 + R() * 2, rot: R() * 6, vr: 3, color: R() < 0.5 ? '#ffd84a' : '#ff8ad8', life: 1.6 }); return; }
      push({ kind: 'pawc', x: rx(b), y: ry(b), vx: 0, vy: 0, g: 0, r: 4 + R() * 2, rot: (R() - 0.5) * 1.2, color: st === 2 ? 'rgba(255,79,163,.7)' : 'rgba(255,240,194,.75)', life: 1.6 });
    } },
    firework: { rate: 1.4, spawn(b, st) {
      if (st === 3 && R() < 0.12) { const x = rx(b), y = b.y + R() * b.h * 0.5; for (let i = 0; i < 10; i++) { const a = R() * 6.28, v = 60 + R() * 60; push({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 60, r: 2.5, color: PASTEL[Math.floor(R() * 5)], life: 0.9 }); } return; }
      push({ kind: 'spark', x: b.x + b.w * (0.3 + R() * 0.4), y: b.y + b.h - 10, vx: (R() - 0.5) * 60, vy: -90 - R() * 70, g: 160, r: 2 + R() * 1.5, color: ['#ffe14a', '#ff4fa3', '#2bd4ff', '#fff'][Math.floor(R() * 4)], life: 1.2 });
    } },
    chili: { rate: 1.4, spawn(b, st) { push({ kind: 'ember', x: rx(b), y: b.y + b.h - 10, vx: (R() - 0.5) * 20, vy: -30 - R() * 50, g: -30, r: 2 + R() * (st === 3 ? 3.5 : 2), color: ['#ff7a1f', '#ffe14a', '#e8202a'][Math.floor(R() * 3)], life: 1.5 }); } },
    ghost: { rate: 0.55, spawn(b, st) {
      if (st === 3 && R() < 0.6) { push({ kind: 'snow', x: rx(b), y: b.y + b.h, vx: (R() - 0.5) * 10, vy: -16 - R() * 14, g: 0, r: 2 + R() * 3, sway: 20, color: 'rgba(155,60,255,.6)', life: 3 }); return; }
      push({ kind: 'ghostp', x: rx(b), y: b.y + b.h * (0.4 + R() * 0.6), vx: (R() - 0.5) * 16, vy: -14 - R() * 10, g: 0, r: 4 + R() * 3, color: st === 2 ? '#c79bff' : '#dfe8ff', sway: 18, life: 3.2 });
    } },
    slime: { rate: 0.6, spawn(b, st) { push({ kind: 'blob', x: rx(b), y: b.y - 8, vx: (R() - 0.5) * 20, vy: 10, g: 500, r: 3.5 + R() * 2.5, color: st === 3 ? ['#5fd62a', '#2bb8ff', '#ffd84a'][Math.floor(R() * 3)] : (R() < 0.7 ? '#5fd62a' : '#2bb8ff'), bounce: true, floor: b.y + b.h - 6, life: 3 }); } },
    bolt: { rate: 0.9, spawn(b, st) {
      const edge = R() < 0.5 ? b.x + (R() < 0.5 ? 6 : b.w - 6) : rx(b), yy = edge === b.x + 6 || edge === b.x + b.w - 6 ? ry(b) : (R() < 0.5 ? b.y + 6 : b.y + b.h - 6);
      push({ kind: 'zap', x: edge, y: yy, vx: 0, vy: 0, g: 0, r: 5 + R() * (st === 3 ? 10 : 5), rot: R() * 6, color: st === 3 ? '#8fe6ff' : '#ffe14a', life: 0.45 });
      if (st >= 2 && R() < 0.5) push({ kind: 'spark', x: edge, y: yy, vx: (R() - 0.5) * 120, vy: (R() - 0.5) * 120, g: 200, r: 1.5, color: '#fff', life: 0.5 });
    } },
    candy: { rate: 0.8, spawn(b, st) {
      if (st === 3 && R() < 0.5) { push({ kind: 'snow', x: rx(b), y: b.y - 6, vx: 0, vy: 20 + R() * 20, g: 0, r: 1.2 + R() * 1.5, sway: 10, color: '#fff', life: 3.5 }); return; }
      push({ kind: 'candyp', x: rx(b), y: b.y - 8, vx: (R() - 0.5) * 20, vy: 16 + R() * 16, g: 8, r: 3 + R() * 1.5, rot: R() * 6, vr: 1.5, sway: 30, color: PASTEL[Math.floor(R() * 5)], life: 3.6 });
    } },
  };
  /* The governor: if frames run long while the weather is on, thin it, then stop it and switch the page to lite effects. */

  }
  let paused = false;
  function emitAmbient(dt) {
    const a = AMBIENT[amb.theme]; if (!a) return;
    govern(dt);
    if (paused) return;
    if (parts.length > 36) return;
    ambAcc += dt * a.rate * STAGE_RATE[amb.stage] * quality;
    ambT += dt; if (ambT > 0.5) { ambT = 0; amb.box = null; }
    while (ambAcc >= 1) { ambAcc -= 1; if (!amb.box) amb.box = box(); if (amb.box.w > 0) a.spawn(amb.box, amb.stage); }
  }
  /* Start (or change) the cabinet's idle weather; ambient(null) stops it. */
  function ambient(el, theme, stage) {
    if (reduce || !el || !theme || !AMBIENT[theme] || quality === 0 || document.documentElement.dataset.fx === 'lite') { amb = null; return; }
    if (amb && amb.el === el && amb.theme === theme && amb.stage === stage) return;
    size(); amb = { el, theme, stage, box: null }; ambAcc = 0; go();
  }

  /* A little puff of sparks at an element (a paying cell). */
  function puff(el, color) {
    if (reduce || !el) return;
    size();
    const a = el.getBoundingClientRect(), b = cv.getBoundingClientRect(), x = a.left - b.left + a.width / 2, y = a.top - b.top + a.height / 2;
    for (let i = 0; i < 7; i++) { const ang = R() * 6.28, v = 60 + R() * 90; push({ kind: 'spark', x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 30, g: 300, r: 2 + R() * 1.5, color: color || '#ffd84a', life: 0.5 }); }
    go();
  }
  /* Coin rain that keeps falling (through the bonus spins) until it is turned off. */
  let raining = false, rainAcc = 0;
  function rain(on) { raining = !!on; if (raining) { size(); go(); } }
  function emitRain(dt) {
    rainAcc += dt * 6;
    while (rainAcc >= 1) { rainAcc -= 1; push(R() < 0.75 ? { kind: 'coin', x: R() * W, y: -20, vx: (R() - 0.5) * 60, vy: 120 + R() * 160, r: 6 + R() * 5, rot: R() * 6, vr: (R() - 0.5) * 12, g: 500, life: 5 } : { kind: 'confetti', x: R() * W, y: -20, vx: (R() - 0.5) * 80, vy: 100 + R() * 140, r: 4 + R() * 3, rot: R() * 6, vr: (R() - 0.5) * 14, g: 350, color: CONF[Math.floor(R() * CONF.length)], life: 5 }); }
  }

  /* The crush: a shockwave on the losing side and debris flying out. side 0 is left, 1 is right. */
  function stomp(side) {
    size();
    const x = side ? W * 0.72 : W * 0.28, y = H * 0.46;
    setTimeout(() => {
      flash = { color: '#ff1f3d', a: 0.45, t: 0.25, dur: 0.25 };
      rings.push({ x, y, r0: 10, r1: 260, w: 14, life: 0.55, age: 0, color: '#ff1f3d' });
      rings.push({ x, y, r0: 10, r1: 180, w: 8, life: 0.45, age: -0.08, color: '#ffffff' });
      burst(60, 'confetti', x, y, 620, i => ({ color: ['#ff1f3d', '#ffffff', '#1b0738', '#ff8aa8'][i % 4], r: 4 + R() * 6, g: 1100 }));
      const app = document.getElementById('app'); app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 450);
      go();
    }, 380);
  }

  function jackpot(fam, cab) {
    if (reduce) { shower(30, 'confetti'); return; }
    size();
    let cx = W / 2, cy = H * 0.4;
    if (cab) { const a = cab.getBoundingClientRect(), b = cv.getBoundingClientRect(); cx = a.left - b.left + a.width / 2; cy = a.top - b.top + a.height / 2; }
    (SHOW[fam] || SHOW.bank)(cx, cy);
    go();
    if (shakeUntil > performance.now()) {
      const app = document.getElementById('app');
      app.classList.add('shake');
      setTimeout(() => app.classList.remove('shake'), shakeUntil - performance.now());
    }
  }

  return { puff, rain, ambient, pause(on) { paused = !!on; }, setLite(on) { quality = on ? 0 : 1; slow = 0; if (on) amb = null; }, coins: n => shower(n, 'coin'), confetti: n => shower(n, 'confetti'), jackpot, stomp, flash(color) { size(); flash = { color, a: 0.5, t: 0.35, dur: 0.35 }; go(); }, clear() { parts = []; rings = []; flash = null; } };
})();

<script>
/* Cabinet art: every build dresses the machine three times over.
   Stage 1 (40% of the machine): the build's own cabinet. Stage 2 (first Mega): the deluxe version.
   Stage 3 (Ascension): the machine goes over the top.
   Each stage is a topper (above the reels), two pillars and a foot, drawn as small SVGs in px with
   percent-anchored groups so they fit any phone width. Animations are CSS classes (a-*) from style.css. */
const CABS = (() => {
  const TOP_H = 72, SIDE_W = 24, FOOT_H = 30;
  let uid = 0;
  const top = (inner, defs) => '<svg class="art-top" width="100%" height="' + TOP_H + '" aria-hidden="true">' + (defs ? '<defs>' + defs + '</defs>' : '') + inner + '</svg>';
  const side = (inner, defs) => '<svg class="art-side" width="' + SIDE_W + '" height="100%" aria-hidden="true">' + (defs ? '<defs>' + defs + '</defs>' : '') + inner + '</svg>';
  const foot = (inner, defs) => '<svg class="art-foot" width="100%" height="' + FOOT_H + '" aria-hidden="true">' + (defs ? '<defs>' + defs + '</defs>' : '') + inner + '</svg>';
  const mid = (inner, y) => '<svg x="50%" y="' + (y || 0) + '" overflow="visible">' + inner + '</svg>';
  const right = (inner, y) => '<svg x="100%" y="' + (y || 0) + '" overflow="visible">' + inner + '</svg>';
  const band = (fill, h, y) => '<rect x="0" y="' + (y || 0) + '" width="100%" height="' + (h || TOP_H) + '" fill="' + fill + '"/>';
  const fullH = (fill) => '<rect x="0" y="0" width="100%" height="100%" fill="' + fill + '"/>';
  const pat = (id, w, h, inner) => '<pattern id="' + id + '" width="' + w + '" height="' + h + '" patternUnits="userSpaceOnUse">' + inner + '</pattern>';
  const lin = (id, stops, vert) => '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (vert ? 0 : 1) + '" y2="' + (vert ? 1 : 0) + '">' + stops.map((s, i) => '<stop offset="' + (i / (stops.length - 1)) + '" stop-color="' + s + '"/>').join('') + '</linearGradient>';
  const rad = (id, stops) => '<radialGradient id="' + id + '">' + stops.map((s, i) => '<stop offset="' + (i / (stops.length - 1)) + '" stop-color="' + s + '"/>').join('') + '</radialGradient>';
  const use = (k, x, y, s, extra) => '<use href="#s-' + k + '" x="' + (x - s / 2) + '" y="' + (y - s / 2) + '" width="' + s + '" height="' + s + '"' + (extra || '') + '/>';
  const txt = (t, x, y, size, fill, extra) => '<text x="' + x + '" y="' + y + '" font-family="Titan One, Impact, sans-serif" font-size="' + size + '" fill="' + fill + '" text-anchor="middle"' + (extra || '') + '>' + t + '</text>';
  const star = (x, y, r, fill, cls) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ' ' + (y + rr * Math.sin(a)).toFixed(1); } return '<path d="' + d + 'Z" fill="' + fill + '"' + (cls ? ' class="' + cls + '"' : '') + '/>'; };
  const bulbRow = (y, n, w, on, off, cls) => { let h = ''; for (let i = 0; i < n; i++) h += '<circle cx="' + (w / 2 + (i - (n - 1) / 2) * 14) + '" cy="' + y + '" r="3.2" fill="' + (i % 2 ? on : off) + '" class="' + (cls || 'a-blink') + '" style="animation-delay:' + (i * 0.11) + 's"/>'; return h; };
  const seq = (n, f) => { let h = ''; for (let i = 0; i < n; i++) h += f(i); return h; };

  /* ------------------------------------------------------------ fruit */
  function fruit(st) {
    const id = 'fr' + (uid++);
    const splat = (x, y, r, c) => '<path d="M' + x + ' ' + (y - r) + ' q' + r * .6 + ' -' + r * .3 + ' ' + r + ' ' + r * .4 + ' q' + r * .5 + ' ' + r * .8 + ' -' + r * .5 + ' ' + r * .9 + ' q-' + r * .7 + ' ' + r * .5 + ' -' + r * 1.1 + ' -' + r * .2 + ' q-' + r * .5 + ' -' + r * .8 + ' ' + r * .6 + ' -' + r * 1.1 + 'z" fill="' + c + '"/>';
    const drip = (x, h, c, w) => '<path d="M' + (x - (w || 4)) + ' 0 v' + h + ' a' + (w || 4) + ' ' + (w || 4) + ' 0 0 0 ' + 2 * (w || 4) + ' 0 v-' + h + 'z" fill="' + c + '"/>';
    if (st === 1) {
      // Fruit Frenzy: a hot-pink cabinet, spray-paint splats and drips, sticker-bombed topper.
      const defs = lin(id + 'a', ['#ff2d86', '#ff7a1f'], true);

  function bolt(st) {
    const id = 'bt' + (uid++);
    const zap = (x, y, s, c, delay) => '<path d="M' + x + ' ' + y + ' l-' + s * .4 + ' ' + s + ' h' + s * .4 + ' l-' + s * .3 + ' ' + s + ' l' + s * .9 + ' -' + s * 1.3 + ' h-' + s * .4 + ' l' + s * .4 + ' -' + s * .7 + 'z" fill="' + (c || '#ffe14a') + '" class="a-flick" style="animation-delay:' + (delay || 0) + 's;filter:drop-shadow(0 0 5px ' + (c || '#ffe14a') + ')"/>';
    const cloud = (x, y, s, c) => '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><ellipse rx="22" ry="10" fill="' + c + '"/><circle cx="-10" cy="-5" r="10" fill="' + c + '"/><circle cx="6" cy="-8" r="12" fill="' + c + '"/><circle cx="16" cy="-2" r="8" fill="' + c + '"/></g>';
    if (st === 1) {
      // Storm Front: dark clouds, rain down the pillars, puddles at the foot.
      const sky = lin(id + 'sk', ['#1f2a44', '#3a4a6a'], true);
      return {
        top: top(band('url(#' + id + 'sk)') + cloud(40, 20, 1.2, '#4a5a7a') + cloud(120, 28, .9, '#2f3a54') + right(cloud(-40, 20, 1.2, '#4a5a7a') + cloud(-120, 28, .9, '#2f3a54')) + zap(70, 30, 8, '#ffe14a', .4) + right(zap(-80, 30, 8, '#ffe14a', .9)) +
          mid(cloud(0, 22, 1.6, '#2f3a54') + zap(-10, 34, 14, '#ffe14a', 0) + zap(20, 40, 8, '#fff', .6) + seq(12, i => '<line x1="' + (-120 + i * 22) + '" y1="48" x2="' + (-124 + i * 22) + '" y2="64" stroke="#8fb0e8" stroke-width="2" class="a-rain" style="animation-delay:' + (i % 4) * .3 + 's"/>')), sky),
        left: side(fullH('url(#' + id + 'sk)') + seq(16, i => '<line x1="' + (4 + (i % 3) * 7) + '" y1="' + (i * 36) + '" x2="' + (2 + (i % 3) * 7) + '" y2="' + (i * 36 + 14) + '" stroke="#8fb0e8" stroke-width="2" class="a-rain" style="animation-delay:' + (i % 5) * .2 + 's"/>'), sky),
        right: side(fullH('url(#' + id + 'sk)') + seq(16, i => '<line x1="' + (6 + (i % 3) * 7) + '" y1="' + (18 + i * 36) + '" x2="' + (4 + (i % 3) * 7) + '" y2="' + (i * 36 + 32) + '" stroke="#8fb0e8" stroke-width="2" class="a-rain" style="animation-delay:' + (i % 5) * .25 + 's"/>'), sky),
        foot: foot(band('#1f2a44', FOOT_H) + seq(10, i => '<ellipse cx="' + (20 + i * 44) + '" cy="20" rx="16" ry="4" fill="#4a5a7a" opacity=".8"/><ellipse cx="' + (20 + i * 44) + '" cy="20" rx="8" ry="2" fill="none" stroke="#8fb0e8" class="a-pulse" style="animation-delay:' + i * .3 + 's"/>') + mid('<rect x="-48" y="5" width="96" height="18" rx="4" fill="#0a0a1e"/>' + txt('STORM FRONT', 0, 18, 11, '#ffe14a')), sky),
      };
    }
    if (st === 2) {
      // Lightning Rod: rods with arcs between them, a weather vane, bolts everywhere.
      const arc = (x1, y1, x2, y2, delay) => '<path d="M' + x1 + ' ' + y1 + ' l' + ((x2 - x1) * .3).toFixed(1) + ' ' + ((y2 - y1) * .3 - 6).toFixed(1) + ' l' + ((x2 - x1) * .2).toFixed(1) + ' ' + ((y2 - y1) * .2 + 8).toFixed(1) + ' l' + ((x2 - x1) * .25).toFixed(1) + ' ' + ((y2 - y1) * .25 - 5).toFixed(1) + ' L' + x2 + ' ' + y2 + '" stroke="#8fe6ff" stroke-width="2" fill="none" class="a-flick" style="animation-delay:' + delay + 's;filter:drop-shadow(0 0 4px #8fe6ff)"/>';
      return {
        top: top(band('#0a0a1e') + seq(6, i => '<rect x="' + (20 + i * 56) + '" y="20" width="4" height="52" fill="#aab6d6"/><circle cx="' + (22 + i * 56) + '" cy="18" r="4" fill="#fff"/>' + arc(22 + i * 56, 18, 78 + i * 56, 18, i * .3)) +
          mid('<rect x="-3" y="10" width="6" height="62" fill="#aab6d6"/><path d="M-20 30 h40 M0 30 l-6 -8 M0 30 l6 -8" stroke="#aab6d6" stroke-width="3"/><path d="M0 10 l10 8 l-10 4z" fill="#ffe14a" class="a-sway" style="transform-origin:0 18px"/>' + zap(-50, 20, 12, '#ffe14a', .2) + zap(50, 26, 10, '#fff', .7)), ''),
        left: side(fullH('#0a0a1e') + '<rect x="10" y="0" width="4" height="100%" fill="#aab6d6"/>' + seq(9, i => '<circle cx="12" cy="' + (30 + i * 60) + '" r="4" fill="#fff" class="a-blink" style="animation-delay:' + i * .2 + 's"/>' + zap(4, 40 + i * 60, 6, '#8fe6ff', i * .25))),
        right: side(fullH('#0a0a1e') + '<rect x="10" y="0" width="4" height="100%" fill="#aab6d6"/>' + seq(9, i => '<circle cx="12" cy="' + (60 + i * 60) + '" r="4" fill="#fff" class="a-blink" style="animation-delay:' + i * .22 + 's"/>' + zap(16, 70 + i * 60, 6, '#8fe6ff', i * .3))),
        foot: foot(band('#0a0a1e', FOOT_H) + seq(10, i => arc(i * 44, 20, i * 44 + 44, 20, i * .2)) + mid('<rect x="-56" y="5" width="112" height="18" rx="4" fill="#0a0a1e" stroke="#8fe6ff"/>' + txt('LIGHTNING ROD', 0, 18, 11, '#8fe6ff'))),
      };
    }
    // Tesla Lab: brass coils, gauges, arcs leaping between everything.
    const brass = lin(id + 'b', ['#ffe680', '#c98f00', '#5a3a00'], true);
    const coil = (x, y, h) => '<rect x="' + (x - 8) + '" y="' + y + '" width="16" height="' + h + '" rx="3" fill="url(#' + id + 'b)" stroke="#1b0738" stroke-width="1.5"/>' + seq(Math.floor(h / 6), i => '<line x1="' + (x - 8) + '" y1="' + (y + 4 + i * 6) + '" x2="' + (x + 8) + '" y2="' + (y + 4 + i * 6) + '" stroke="#5a3a00" stroke-width="1"/>') + '<circle cx="' + x + '" cy="' + (y - 6) + '" r="8" fill="#e8ecf4" stroke="#1b0738" stroke-width="1.5"/>';
    const gauge = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="10" fill="#fff6c2" stroke="url(#' + id + 'b)" stroke-width="3"/><path d="M' + x + ' ' + y + ' l6 -6" stroke="#e8202a" stroke-width="2" class="a-sway" style="transform-origin:' + x + 'px ' + y + 'px"/>';
    return {
      top: top(band('#2a1a0a') + coil(40, 26, 46) + coil(90, 36, 36) + right(coil(-40, 26, 46) + coil(-90, 36, 36)) + gauge(140, 50) + right(gauge(-140, 50)) +
        mid('<g class="a-spin-slow" style="transform-origin:0 40px">' + seq(8, i => '<path d="M0 40 l' + (60 * Math.cos(i * Math.PI / 4)).toFixed(1) + ' ' + (60 * Math.sin(i * Math.PI / 4)).toFixed(1) + '" stroke="#8fe6ff" stroke-width="2" class="a-flick" style="animation-delay:' + i * .15 + 's;filter:drop-shadow(0 0 4px #8fe6ff)"/>') + '</g>' + '<g class="a-float">' + use('tesla', 0, 40, 50, ' style="filter:drop-shadow(0 0 10px #8fe6ff)"') + '</g>'), brass),
      left: side(fullH('#2a1a0a') + coil(12, 10, 2000) + seq(8, i => zap(6 + (i % 2) * 12, 40 + i * 70, 6, '#8fe6ff', i * .3)), brass),
      right: side(fullH('#2a1a0a') + coil(12, 10, 2000) + seq(8, i => zap(18 - (i % 2) * 12, 75 + i * 70, 6, '#8fe6ff', i * .35)), brass),
      foot: foot(band('#2a1a0a', FOOT_H) + '<rect x="0" y="0" width="100%" height="4" fill="url(#' + id + 'b)"/><rect x="0" y="26" width="100%" height="4" fill="url(#' + id + 'b)"/>' + seq(8, i => gauge(24 + i * 52, 15)) + mid('<rect x="-44" y="5" width="88" height="20" rx="4" fill="#2a1a0a" stroke="url(#' + id + 'b)" stroke-width="2"/>' + txt('TESLA LAB', 0, 19, 11, '#ffe680')), brass),
    };
  }

  /* ------------------------------------------------------------ candy */
  function candy(st) {
    const id = 'cd' + (uid++);
    const stripes = pat(id + 's', 24, 12, '<rect width="12" height="12" fill="#ff4fa3"/><rect x="12" width="12" height="12" fill="#fff"/>');
    const sprinkle = (x, y, c) => '<rect x="' + x + '" y="' + y + '" width="6" height="2.5" rx="1" fill="' + c + '" transform="rotate(' + ((x * 7 + y * 3) % 90) + ' ' + x + ' ' + y + ')"/>';
    const SPR = ['#ff4fa3', '#5ee8b0', '#ffe14a', '#2bd4ff', '#c79bff', '#fff'];
    if (st === 1) {
      // Candy Shop: a pink-and-white awning, jars of sweets, lollipop pillars.
      const jar = (x, y, c) => '<g transform="translate(' + x + ' ' + y + ')"><rect x="-12" y="-18" width="24" height="34" rx="6" fill="rgba(255,255,255,.35)" stroke="#1b0738" stroke-width="2"/><rect x="-8" y="-24" width="16" height="8" rx="2" fill="#1b0738"/>' + seq(6, i => '<circle cx="' + (-7 + (i % 3) * 7) + '" cy="' + (-4 + Math.floor(i / 3) * 10) + '" r="3.5" fill="' + c[i % c.length] + '"/>') + '</g>';
      return {
        top: top(band('#ffd1ec') + '<rect x="0" y="0" width="100%" height="14" fill="url(#' + id + 's)"/><path d="M0 14 h600 v4 ' + seq(50, () => 'q-6 8 -12 0 ') + 'z" fill="#ff4fa3"/>' + jar(40, 48, ['#ff4fa3', '#5ee8b0', '#ffe14a']) + jar(76, 52, ['#2bd4ff', '#c79bff']) + right(jar(-40, 48, ['#ffe14a', '#ff4fa3']) + jar(-76, 52, ['#5ee8b0', '#2bd4ff', '#ff4fa3'])) +
          mid('<rect x="-60" y="28" width="120" height="36" rx="18" fill="#fff" stroke="#ff4fa3" stroke-width="3"/>' + txt('CANDY SHOP', 0, 52, 15, '#ff4fa3') + use('lollipop', -84, 48, 26) + use('gumdrop', 84, 48, 26)), stripes),
        left: side(fullH('#ffd1ec') + '<rect x="9" y="0" width="6" height="100%" fill="#fff" stroke="#1b0738" stroke-width="1"/>' + seq(6, i => '<circle cx="12" cy="' + (30 + i * 90) + '" r="11" fill="' + SPR[i % 5] + '" stroke="#1b0738" stroke-width="2"/><path d="M12 ' + (30 + i * 90) + ' m-7 0 a7 7 0 0 1 14 0 a4 4 0 0 1 -8 0" fill="none" stroke="#fff" stroke-width="2.5"/>'), stripes),
        right: side(fullH('#ffd1ec') + '<rect x="9" y="0" width="6" height="100%" fill="#fff" stroke="#1b0738" stroke-width="1"/>' + seq(6, i => '<circle cx="12" cy="' + (75 + i * 90) + '" r="11" fill="' + SPR[(i + 2) % 5] + '" stroke="#1b0738" stroke-width="2"/><path d="M12 ' + (75 + i * 90) + ' m-7 0 a7 7 0 0 1 14 0 a4 4 0 0 1 -8 0" fill="none" stroke="#fff" stroke-width="2.5"/>'), stripes),
        foot: foot(band('#ffd1ec', FOOT_H) + seq(40, i => sprinkle(4 + i * 12, 6 + (i * 7) % 18, SPR[i % 6])) + mid('<rect x="-46" y="6" width="92" height="18" rx="9" fill="#fff" stroke="#ff4fa3" stroke-width="2"/>' + txt('CANDY SHOP', 0, 19, 11, '#ff4fa3')), stripes),
      };
    }
    if (st === 2) {
      // Sugar Rush: candy-cane pillars, a gumball machine, sprinkles raining.
      const cane = pat(id + 'c', 12, 12, '<rect width="12" height="12" fill="#fff"/><path d="M-4 12 l12 -12 M4 16 l12 -12" stroke="#e8204e" stroke-width="5"/>');
      return {
        top: top(band('#5ee8b0') + seq(18, i => '<g class="a-rain" style="animation-delay:' + (i * .37 % 2.8) + 's">' + sprinkle(10 + i * 26, -4, SPR[i % 6]) + '</g>') +
          mid('<circle cx="0" cy="30" r="26" fill="rgba(255,255,255,.4)" stroke="#1b0738" stroke-width="2.5"/>' + seq(14, i => '<circle cx="' + (18 * Math.cos(i * 1.3)).toFixed(1) + '" cy="' + (30 + 14 * Math.sin(i * 1.3)).toFixed(1) + '" r="5" fill="' + SPR[i % 6] + '" stroke="#1b0738" stroke-width="1"/>') + '<rect x="-18" y="54" width="36" height="18" rx="3" fill="#e8204e" stroke="#1b0738" stroke-width="2"/><circle cx="0" cy="63" r="4" fill="#fff6c2" stroke="#1b0738"/><rect x="-10" y="2" width="20" height="6" rx="2" fill="#e8204e" stroke="#1b0738"/>' +
            txt('SUGAR', -80, 40, 16, '#fff', ' transform="rotate(-8 -80 40)" style="filter:drop-shadow(0 2px 0 #e8204e)"') + txt('RUSH', 80, 40, 16, '#fff', ' transform="rotate(8 80 40)" style="filter:drop-shadow(0 2px 0 #e8204e)"')), cane),
        left: side(fullH('#5ee8b0') + '<rect x="4" y="0" width="16" height="100%" rx="8" fill="url(#' + id + 'c)" stroke="#1b0738" stroke-width="1.5"/>', cane),
        right: side(fullH('#5ee8b0') + '<rect x="4" y="0" width="16" height="100%" rx="8" fill="url(#' + id + 'c)" stroke="#1b0738" stroke-width="1.5"/>', cane),
        foot: foot(band('#ffd1ec', FOOT_H) + seq(40, i => sprinkle(4 + i * 12, 6 + (i * 11) % 18, SPR[i % 6])) + mid('<rect x="-44" y="6" width="88" height="18" rx="9" fill="#e8204e"/>' + txt('SUGAR RUSH', 0, 19, 11, '#fff')), cane),
      };
    }
    // Candy Land: a lollipop forest, gummy bears, a chocolate river that flows.
    const choc = lin(id + 'ch', ['#8a5a2b', '#5a3615'], true);
    const lolly = (x, y, r, c, c2) => '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + 40) + '" stroke="#fff" stroke-width="4"/><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + c + '" stroke="#1b0738" stroke-width="2"/><path d="M' + x + ' ' + y + ' m-' + r * .6 + ' 0 a' + r * .6 + ' ' + r * .6 + ' 0 0 1 ' + r * 1.2 + ' 0 a' + r * .35 + ' ' + r * .35 + ' 0 0 1 -' + r * .7 + ' 0" fill="none" stroke="' + (c2 || '#fff') + '" stroke-width="3"/>';
    const gummy = (x, y, c) => '<g transform="translate(' + x + ' ' + y + ')"><ellipse rx="7" ry="8" cy="4" fill="' + c + '" opacity=".9"/><circle r="5" cy="-5" fill="' + c + '" opacity=".9"/><circle cx="-4" cy="-9" r="2" fill="' + c + '"/><circle cx="4" cy="-9" r="2" fill="' + c + '"/></g>';
    return {
      top: top(band('#bff5ff') + '<path d="M-20 40 q60 -40 120 -10 t120 -10 t120 10" stroke="#ff4fa3" stroke-width="6" fill="none" opacity=".5"/><path d="M-20 46 q60 -40 120 -10 t120 -10 t120 10" stroke="#ffe14a" stroke-width="6" fill="none" opacity=".5"/><path d="M-20 52 q60 -40 120 -10 t120 -10 t120 10" stroke="#5ee8b0" stroke-width="6" fill="none" opacity=".5"/>' +
        lolly(30, 30, 14, '#ff4fa3') + lolly(60, 44, 9, '#5ee8b0') + right(lolly(-30, 30, 14, '#2bd4ff') + lolly(-60, 44, 9, '#ffe14a')) +
        mid('<g class="a-float">' + use('jawbreaker', 0, 34, 46, ' style="filter:drop-shadow(0 0 8px #ff4fa3)"') + '</g>' + gummy(-70, 54, '#ff4fa3') + gummy(70, 54, '#5ee8b0') + gummy(-96, 58, '#ffe14a') + gummy(96, 58, '#2bd4ff') + '<path d="M-130 72 v-6 q40 -10 80 0 t80 0 t80 0 t80 0 v6z" fill="#5ee8b0"/>'), choc),
      left: side(fullH('#bff5ff') + seq(5, i => lolly(12, 30 + i * 100, 9, SPR[i % 5], '#fff')), choc),
      right: side(fullH('#bff5ff') + seq(5, i => lolly(12, 80 + i * 100, 9, SPR[(i + 3) % 5], '#fff')), choc),
      foot: foot(band('url(#' + id + 'ch)', FOOT_H) + '<path d="M0 12 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="#b8803c" stroke-width="3" fill="none" class="a-road" stroke-dasharray="30 20"/>' + seq(6, i => gummy(30 + i * 70, 16, SPR[i % 6])) + mid('<rect x="-44" y="6" width="88" height="18" rx="9" fill="#fff"/>' + txt('CANDY LAND', 0, 19, 11, '#ff4fa3')), choc),
    };
  }

  /* ------------------------------------------------------------ crests
     Art that rises above the cabinet so each machine has its own silhouette. Drawn in a 44px-tall box whose
     bottom edge (y=44) is the cabinet's top edge; content may rise above y=0 a little. */
  const CREST_H = 44;
  const crestSvg = (inner, defs) => '<svg class="art-crest" width="100%" height="' + CREST_H + '" overflow="visible" aria-hidden="true">' + (defs ? '<defs>' + defs + '</defs>' : '') + '<g transform="translate(0 ' + CREST_H + ') scale(.78) translate(0 -' + CREST_H + ')">' + inner + '</g></svg>';
  const flameC = (x, y, w, h, c1, c2, delay) => '<g class="a-flame" style="animation-delay:' + delay + 's"><path d="M' + x + ' ' + y + ' q' + (-w / 2) + ' ' + (-h * .3) + ' ' + (-w * .1) + ' ' + (-h * .55) + ' q' + (w * .2) + ' ' + (h * .15) + ' ' + (w * .15) + ' ' + (-h * .25) + ' q' + (w * .25) + ' ' + (h * .1) + ' ' + (w * .1) + ' ' + (h * .5) + ' q' + (w * .5) + ' ' + (-h * .2) + ' ' + (w * .25) + ' ' + (h * .3) + ' q0 ' + (h * .35) + ' ' + (-w * .6) + ' ' + (h * .35) + 'z" fill="' + c1 + '"/><path d="M' + x + ' ' + y + ' q' + (-w * .25) + ' ' + (-h * .2) + ' ' + (-w * .05) + ' ' + (-h * .3) + ' q' + (w * .15) + ' ' + (h * .1) + ' ' + (w * .1) + ' ' + (h * .1) + ' q' + (w * .2) + ' ' + (-h * .05) + ' ' + (w * .08) + ' ' + (h * .2) + 'z" fill="' + c2 + '"/></g>';
  const glow = (c) => ' style="filter:drop-shadow(0 0 6px ' + c + ')"';
  const CREST = {
    fruit(st) {
      if (st === 1) return '';
      if (st === 2) return crestSvg('<path d="M30 44 q-10 -30 20 -34 q-4 22 -20 34z" fill="#1fbf5a"/><path d="M34 44 q0 -22 22 -28" stroke="#a6ff4d" stroke-width="2" fill="none"/><path d="M58 44 q6 -24 30 -22 q-10 14 -30 22z" fill="#1fbf5a"/>' + right('<path d="M-30 44 q10 -30 -20 -34 q4 22 20 34z" fill="#1fbf5a"/><path d="M-34 44 q0 -22 -22 -28" stroke="#a6ff4d" stroke-width="2" fill="none"/><path d="M-58 44 q-6 -24 -30 -22 q10 14 30 22z" fill="#1fbf5a"/>'));
      return crestSvg(mid(seq(7, i => '<path d="M0 44 q' + ((i - 3) * 14) + ' -14 ' + ((i - 3) * 22) + ' -' + (36 - Math.abs(i - 3) * 7) + '" stroke="#a6ff4d" stroke-width="4" stroke-linecap="round" fill="none" class="a-neon" style="animation-delay:' + i * .17 + 's;filter:drop-shadow(0 0 5px #a6ff4d)"/>') + star(-44, 14, 5, '#ff4fa3', 'a-twinkle') + star(48, 10, 5, '#2bd4ff', 'a-twinkle')));
    },
    gem(st) {
      if (st === 1) return crestSvg(mid('<path d="M-40 44 l34 -30 h12 l34 30z" fill="#5a3615" stroke="#2a1708" stroke-width="2"/><rect x="-5" y="4" width="10" height="40" fill="#8a5a2b" stroke="#2a1708" stroke-width="1.5"/><g class="a-spin-slow"><circle cx="0" cy="18" r="9" fill="none" stroke="#aab6d6" stroke-width="3"/><path d="M-9 18 h18 M0 9 v18" stroke="#aab6d6" stroke-width="2"/></g>'));
      if (st === 2) return crestSvg(mid('<path d="M-70 44 q0 -30 70 -34 q70 4 70 34" fill="none" stroke="#ffd84a" stroke-width="5"/><path d="M-70 44 q0 -30 70 -34 q70 4 70 34" fill="none" stroke="#fff6c2" stroke-width="1.5"/>' + seq(5, i => '<circle cx="' + ((i - 2) * 30) + '" cy="' + (14 + Math.abs(i - 2) * 6) + '" r="4" fill="' + ['#ff5a7a', '#5de28a', '#8fe6ff', '#c79bff', '#ffe14a'][i] + '" stroke="#fff" class="a-twinkle" style="animation-delay:' + i * .3 + 's"/>')));
      return crestSvg(mid('<path d="M-60 44 l14 -26 l14 26z" fill="#cfefff" stroke="#9fd4ff"/><path d="M-30 44 l16 -36 l16 36z" fill="#fff" stroke="#9fd4ff"/><path d="M-10 44 l10 -48 l10 48z" fill="#fff" stroke="#8fe6ff"' + glow('#fff') + '/><path d="M10 44 l14 -32 l14 32z" fill="#e6d2ff" stroke="#9fd4ff"/><path d="M36 44 l12 -22 l12 22z" fill="#cfefff" stroke="#9fd4ff"/>' + star(0, -8, 6, '#fff', 'a-twinkle') + star(-30, 4, 4, '#8fe6ff', 'a-twinkle')));
    },
    seven(st) {
      if (st === 1) return '';
      if (st === 2) return crestSvg(mid('<rect x="-3" y="20" width="6" height="24" fill="#8a94a8"/><rect x="-44" y="-4" width="88" height="28" rx="6" fill="#1a0008" stroke="#ffe14a" stroke-width="2"/><g class="a-flick">' + txt('777', 0, 18, 24, '#ff2222', glow('#ff2222')) + '</g>'));
      return crestSvg(seq(12, i => '<svg x="' + (i * 8.3) + '%" overflow="visible">' + flameC(0, 46, 22, 36 + (i % 3) * 10, '#2d86ff', '#e8f6ff', i * .11) + '</svg>'));
    },
    dice(st) {
      if (st === 1) return '';

    const say = t => { if (out.ticker) out.ticker.innerHTML = t; };
    const pace = () => Math.max(50, 125 - n * 5);

      } else if (st.t === 'pay') {

          royal: 'Royals <b>' + st.cards + ' cards in court</b>', cat: st.knocked ? 'Cats <b>knocked ' + st.knocked + '</b>' : 'Cats', firework: 'Fireworks <b>launch ×' + st.launch + '²</b>', chili: 'Chili <b>heat ' + st.heat + '</b>', ghost: 'Ghosts haunt <b>' + st.haunt + ' pieces</b>' + (state && state.phase === 'spin' ? ' of ' + esc(state.players[1 - E.spinner(state)].name) + '’s build' : '') + ': <b>$' + st.amount + '</b> each', slime: 'Slimes', bolt: 'Lightning <b>' + (st.arcs ? st.arcs.length : 0) + ' arcs</b>', candy: 'Candy <b>streak ' + st.streak + '</b>' };

        if (st.arcs && !ui.fast) st.arcs.forEach(j => R.light(j));
        if (st.rolls) {
          for (const r of st.rolls) {

          }
        }
        if (!ui.fast) { R.pop(st.cell); R.float(st.cell, '+' + st.amount.toLocaleString('en-US'), st.fam); if (!st.rolls) Sound.pay(n); if (st.amount >= 100) FX.puff(R.cell(st.cell), FAM_COLOR[st.fam] || '#ffd84a'); }
        else R.light(st.cell);
        out.meter.set(base + st.sum, 80); bump();
        n += 1;
        await wait(pace());
      } else if (st.t === 'grow') {
        R.setPrice(st.kind, st.price);

      } else if (st.t === 'line') {

      } else if (st.t === 'bonus') {

        if (out.mult) out.mult.textContent = '×' + st.by.toFixed(1);

      } else if (st.t === 'burnout') {

        out.meter.set(base, 300); bump();

      } else if (st.t === 'aug') {

        say((names[st.why] || 'Augment') + ' <b>×' + st.by + '</b>');

  const JP_TITLE = { fruit: ['Juiced!', 'Fruit jackpot'], gem: ['Flawless!', 'Gem jackpot'], seven: ['777!', 'Sevens jackpot'], dice: ['Hot dice!', 'Dice jackpot'], bandit: ['Heist!', 'Bandit jackpot'], bank: ['Vault open!', 'Bank jackpot'], bell: ['Ring it!', 'Bell jackpot'], bear: ['Bear hug!', 'Bear jackpot'], royal: ['Crowned!', 'Royal jackpot'], cat: ['Purrfect!', 'Cat jackpot'], firework: ['Kaboom!', 'Fireworks jackpot'], chili: ['On fire!', 'Chili jackpot'], ghost: ['Boo!', 'Ghost jackpot'], slime: ['Oozing!', 'Slime jackpot'], bolt: ['Struck!', 'Lightning jackpot'], candy: ['Sweet!', 'Candy jackpot'] };

      '<div class="tiles">' + tiles + '</div>' + augBadges(pl) + (opts.foot || '') + '</div>';

  /* The lever is pulled by swiping down on it: the arm follows the finger, and past the catch it spins. */

    l.addEventListener('pointerdown', e => { if (ui.busy || state === null || state.phase !== 'spin' || ui.turnDone || isBot(E.spinner(state)) || (Net.active() && E.spinner(state) !== Net.seat())) return; y0 = e.clientY; dy = 0; swiped = false; l.classList.add('dragging'); try { l.setPointerCapture(e.pointerId); } catch (x) {} });

    const after = () => {

        : '<span>' + who + ' spin ' + sp.index + ' of ' + sp.of + '</span>' + (sp.extraSpin ? '<span class="sub">Hourglass: +1 spin</span>' : '');

      // the reels land on the screen as drawn; any cat knocks play out after
      const landed = sp.cells.slice();
      if (sp.nudges && sp.nudges.length) for (let n = sp.nudges.length - 1; n >= 0; n--) landed[sp.nudges[n].cell] = { k: sp.nudges[n].from, t: 0, frozen: false };
      await reels.spin(landed, pool, sp.priceBefore, sp.frozenCols, i > 0, sp.heldBefore, antic);
      if (tk !== ui.token) return;
      await wait(120);
      if (sp.nudges && sp.nudges.length) {
        for (const nd of sp.nudges) {
          if (tk !== ui.token) return;
          const catK = nd.cat < 0 ? 'Magnet' : sp.cells[nd.cat] ? K[sp.cells[nd.cat].k].name : 'Cat';
          ticker.innerHTML = '<b>' + catK + '</b> ' + (nd.cat < 0 ? 'pulls' : 'swats') + ' the ' + K[nd.from].name + ' off <b>→ ' + K[nd.to].name + '</b>';
          if (!ui.fast) Sound.knock();
          await reels.knock(nd.cat, nd.cell, { k: nd.to, t: nd.t, frozen: false }, sp.priceBefore);
          if (!ui.fast) { Sound.land(nd.to); await wait(140); }
        }
        await wait(ui.fast ? 0 : 260);
      }
      await playSteps(reels, sp, { meter, base: run, mult: multEl, ticker, meterBox: $('#meter'), after }, tk);
      if (tk !== ui.token) return;
      if (sp.born && !ui.fast) { sp.born.forEach((k, bi) => { const c = sp.cells.findIndex((x, ci) => K[x.k].fam === 'slime' && ci >= bi); reels.float(c >= 0 ? c : 7, '+1 slime', 'slime'); }); Sound.breed(); renderPlates(); }
      run = sp.runTotal;
      cab.classList.remove('party');
      sp.iceCells.forEach(c => reels.pop(c));
      if (sp.froze && !ui.fast) { reels.stamp(['Frozen!', (sp.froze.length === 1 ? 'One of ' : sp.froze.length + ' of ') + esc(opp.name) + '’s reels'], 'ice', 1000); Sound.ice(); await wait(700); }
      if (sp.sand !== undefined && !ui.fast) {
        if (sp.extraSpin) { reels.stamp(['+1 spin', 'The glass turns over'], 'tier', 1100); Sound.win(2); await wait(900); }
        else sp.iceCells.filter(c => K[sp.cells[c].k].fam === 'hourglass').forEach(c => reels.float(c, 'sand ' + sp.sand + '/' + CFG.sandFull, 'sand'));
      }
      const best = Math.max.apply(null, E.FAMS.map(f => sp.counts[f]));
      if (sp.trigger) {
        ticker.innerHTML = '<b>' + sp.counts[sp.jackpot] + ' ' + FAM_NAME[sp.jackpot] + '</b> on screen';
        if (!ui.fast) {
          // the build-up: every jackpot symbol lights in a wave while the cabinet races and a riser climbs
          cab.classList.add('antic');
          const cells = []; for (let c2 = 0; c2 < E.CELLS; c2++) { const f = K[sp.cells[c2].k].fam; if (f === sp.jackpot || (f === 'wild' && sp.main === sp.jackpot)) cells.push(c2); }
          Sound.riser(900);
          for (let w = 0; w < cells.length; w++) { reels.pop(cells[w]); if (w % 2 === 0) FX.puff(reels.cell(cells[w]), FAM_COLOR[sp.jackpot]); await wait(Math.max(30, 70 - w * 3)); if (tk !== ui.token) return; }
          await wait(200);
          cab.classList.remove('antic');
          Sound.impact(); Sound.buzz([40, 30, 80]); FX.flash('#ffffff'); $('#app').classList.add('shake'); setTimeout(() => $('#app').classList.remove('shake'), 500);
        }
        jackpotShow(sp.jackpot, sp.again ? '+1 bonus spin' : sp.awarded + ' bonus spins', 2600);
        if (!ui.fast) { FX.rain(true); Sound.clinks(30, 2); }
        ui.musicTimer = setTimeout(() => { ui.musicTimer = 0; if (tk === ui.token && ui.busy && !ui.fast) Sound.music.start(sp.jackpot); }, 1800);
        await wait(2600);
      } else if (sp.retrigger) {
        reels.stamp(['+1 spin', 'Jackpot again'], 'tier', 1100);
        Sound.win(3); FX.coins(40);
        await wait(1100);
      } else {
        const tier = bonus ? 0 : winTier(sp.total, round);
        let bestF = 'fruit'; for (const f of E.FAMS) if (sp.counts[f] > sp.counts[bestF]) bestF = f;
        const needM = E.jackpotNeed(me, bestF);
        if (best === needM - 1) ticker.innerHTML = '<b>' + best + ' of ' + needM + '.</b> One short of the jackpot';
        else if (best >= needM) ticker.innerHTML = '<b>' + best + ' on screen.</b> Bonus spins are maxed for this turn';
        else ticker.innerHTML = 'Spin pays <b>' + money(sp.total) + '</b>';
        if (tier === 3 && !ui.fast) { bigWinShow(money(sp.total)); Sound.megawin(); Sound.buzz([30, 20, 30, 20, 60]); FX.coins(140); FX.confetti(60); FX.flash('#ffe14a'); $('#app').classList.add('shake'); setTimeout(() => $('#app').classList.remove('shake'), 500); await wait(2200); }
        else if (tier >= 2 && !ui.fast) { reels.stamp([TIER_WORD[tier], money(sp.total)], 'tier', 1000); Sound.win(tier); FX.coins(45); Sound.clinks(10, 0.8); await wait(1000); }
        else await wait(i === turn.spins.length - 1 ? 250 : 480);
      }
    }
    if (tk !== ui.token) return;
    cab.classList.remove('party', 'bonus');
    meter.set(turn.total, 0); after();
    if (!ui.fast && turn.total > 0) { Sound.ding(); const am = $('#amount'); if (am) { am.classList.remove('land'); void am.offsetWidth; am.classList.add('land'); } }
    FX.rain(false);
    if (ui.musicTimer) { clearTimeout(ui.musicTimer); ui.musicTimer = 0; }
    if (Sound.music.on) { Sound.music.stop(); Sound.fanfare(); Sound.clinks(16, 1); }
    finishTurn(pi, turn);
  }

  /* The end-of-turn view: the banked total, the notes, and the button to hand over. Also used when a saved game resumes on a turn that was spun but never watched. */
  function finishTurn(pi, turn) {
    const me = state.players[pi], opp = state.players[1 - pi], who = '<span class="who' + pi + '">' + esc(me.name) + '</span>';
    $('#marquee').innerHTML = '<span>' + who + ' banks ' + money(turn.total) + '</span>';
    const notes = [];
    if (turn.jackpots) notes.push(turn.jackpots > 1 ? turn.jackpots + ' jackpots' : 'Jackpot');
    if (turn.steal) notes.push('Bandits steal ' + turn.steal + '% of ' + esc(opp.name) + '’s round');
    if (turn.chips) notes.push('Bank: +' + turn.chips + (turn.chips > 1 ? ' chips' : ' chip') + ' next round');
    const fz = turn.spins.find(s => s.froze); if (fz) notes.push('Ice freezes ' + (fz.froze.length === 1 ? 'one of ' + esc(opp.name) + '’s reels' : fz.froze.length + ' of ' + esc(opp.name) + '’s reels') + ' for ' + (CFG.iceSpins === 1 ? 'their next spin' : CFG.iceSpins + ' spins'));
    const hg = turn.spins.filter(s => s.extraSpin).length; if (hg) notes.push('Hourglass: +' + hg + (hg > 1 ? ' spins' : ' spin'));
    const burn = turn.spins.filter(s => s.burnout).length; if (burn) notes.push(burn > 1 ? burn + ' burnouts' : 'Burnout');
    const born = turn.spins.reduce((a, s) => a + (s.born ? s.born.length : 0), 0); if (born) notes.push('+' + born + (born > 1 ? ' slimes' : ' slime'));
    (turn.augNotes || []).forEach(n => notes.push(E.AUGS[n.aug].name + (n.aug === 'cube' ? ': total doubled' : ': +' + money(n.amount))));
    if (turn.jackpots && E.has(me, 'jackpotkey')) notes.push('Jackpot key: a legendary in your next store');
    const lastSpin = turn.spins[turn.spins.length - 1];
    if (lastSpin.stick.length) notes.push(lastSpin.stick.length + ' bells held');
    $('#notes').innerHTML = notes.map(n => '<span class="note">' + n + '</span>').join('');
    renderPlates();
    ui.busy = false; ui.fast = false; ui.turnDone = true; $('#cab').classList.remove('playing'); FX.pause(false);
    if (ui.musicTimer) { clearTimeout(ui.musicTimer); ui.musicTimer = 0; } if (Sound.music.on) Sound.music.stop(); FX.rain(false);
    const btn = $('#btn-spin');
    btn.className = 'btn big ' + (state.phase === 'clash' ? 'gold' : 'hot');
    btn.textContent = state.phase === 'clash' ? 'Clash!' : 'Next: ' + opp.name;
    if (!turn.shown) { turn.shown = true; save(); }
    Tut.on('render');
    if (Net.active()) setTimeout(() => Net.drain(), 0);
  }

  function afterTurn() {
    if (!ui.turnDone || ui.busy) return;
    Sound.tap();
    if (state.phase === 'clash') { Tut.on('clash'); showClash(); } else { Tut.on('nextYou'); renderGame(); }
  }

  /* ---------- clash ---------- */
  async function showClash() {
    const tk = ++ui.token;
    const c = state.clash;
    ui.fast = false;
    const side = p => '<div class="side c' + p + '" id="side' + p + '"><span class="who">' + esc(state.players[p].name) + '</span><span class="num" id="num' + p + '">$0</span><span class="adj" id="adj' + p + '"></span><span class="hp" id="hp' + p + '">' + icon('heart') + '<span>' + ui.hearts[p] + '</span></span></div>';
    const over = E.isOver(state);
    overlay.innerHTML = '<div class="card"><p class="label center">Round ' + state.round + ' of ' + CFG.rounds + '</p><div class="versus">' + side(0) + '<span class="vs">VS</span>' + side(1) + '</div>' +
      '<div class="verdict" id="verdict"></div><button class="btn gold" type="button" id="clash-next" disabled>' + (over ? 'See the winner' : 'Next round') + '</button></div>';
    overlay.dataset.kind = 'clash'; overlay.hidden = false;
    const m = [makeMeter($('#num0'), true), makeMeter($('#num1'), true)];
    const longest = Math.max(money(c.raw[0]).length, money(c.raw[1]).length, money(c.final[0]).length, money(c.final[1]).length);
    const numSize = longest > 9 ? 'clamp(15px, 4.6vw, 21px)' : longest > 7 ? 'clamp(18px, 5.6vw, 26px)' : longest > 6 ? 'clamp(21px, 6.8vw, 31px)' : '';
    for (const p of [0, 1]) $('#num' + p).style.fontSize = numSize;
    Sound.count();
    const big = c.raw[0] >= c.raw[1] ? 0 : 1; m[big].set(c.raw[big], 700, true); m[1 - big].set(c.raw[1 - big], 700);
    await wait(950);
    if (tk !== ui.token) return;
    if (c.stolen[0] || c.stolen[1]) {
      for (const p of [0, 1]) {
        const net = c.stolen[p] - c.stolen[1 - p];
        $('#adj' + p).textContent = net ? (net > 0 ? 'Bandits +' : 'Robbed −') + money(Math.abs(net)) : '';
        m[p].set(c.final[p], 500);
      }
      Sound.reroll();
      await wait(950);
      if (tk !== ui.token) return;
    }
    const v = $('#verdict');
    if (c.winner < 0) v.innerHTML = '<span class="v1">Dead heat</span><span class="v2">Nobody drops a heart</span>';
    else {
      const w = c.winner, l = 1 - w, ko = state.players[l].hearts <= 0;
      $('#side' + w).classList.add('won'); $('#side' + l).classList.add('lost');
      if (c.crush) { $('#side' + l).classList.add('crushed'); crushShow(w, l); } else Sound.clash();
      ui.hearts[l] = state.players[l].hearts;
      renderPlates(l);
      const hp = $('#hp' + l); hp.lastElementChild.textContent = ui.hearts[l]; hp.classList.add('hit');
      v.innerHTML = '<span class="v1">' + (ko ? '<span class="glow"><span class="gold-text">Knockout!</span></span>' : c.crush ? esc(state.players[w].name) + ' crushes it' : esc(state.players[w].name) + ' takes it') + '</span>' +
        '<span class="v2">' + esc(state.players[l].name) + ' −' + c.dmg + ' ' + icon('heart') + (c.crush ? ' <b class="crushtag">more than ' + (c.ratio || CFG.crushRatio) + '× their total</b>' : '') + (c.phoenix ? ' <b class="crushtag">Phoenix: rises with 6 hearts, all Gold</b>' : '') + '</span>';
      setTimeout(() => Sound.hurt(), c.crush ? 900 : 250);
      if (c.crush) await wait(1200);
    }
    await wait(350);
    if (tk !== ui.token) return;
    const nb = $('#clash-next'); if (nb) { nb.disabled = false; nb.focus({ preventScroll: true }); }
    Tut.on('render');
  }

  /* CRUSHED: the losing side gets stomped, the card shakes, and the word drops in from above. */
  function crushShow(w, l) {
    const card = overlay.querySelector('.card');
    const d = document.createElement('div');
    d.className = 'crushshow c' + w;
    d.innerHTML = '<span class="crush-word">Crushed!</span>';
    $('#app').appendChild(d);
    Sound.crush(); Sound.buzz([20, 40, 90]);
    FX.stomp(l);
    setTimeout(() => { if (card) card.classList.add('stomp'); }, 380);
    setTimeout(() => d.classList.add('out'), 1900);
    setTimeout(() => { d.remove(); if (card) card.classList.remove('stomp'); }, 2300);
  }

  function afterClash() {
    Sound.tap();
    if (Tut.active()) Tut.on('clashNext');
    const r = E.next(state, grng);
    ui.hearts = state.players.map(p => p.hearts);
    ui.sel = null; ui.fresh = null; ui.fast = false; ui.confirm = false; ui.peek = false; ui.dealt = true;
    save();
    overlay.hidden = true; overlay.innerHTML = '';
    if (r === 'over') showOver(); else renderGame();
  }

  /* ---------- game over ---------- */
  function showOver() {
    ++ui.token;
    const [a, b] = state.players, w = E.winner(state);
    const ko = a.hearts <= 0 || b.hearts <= 0;
    const head = w < 0 ? '<h2><span class="glow"><span class="gold-text">Dead level</span></span></h2>' :
      '<p class="label center">' + (ko ? 'Knockout in round ' + state.round : a.hearts === b.hearts ? 'Level on hearts, ahead on winnings' : 'Ahead on hearts after ' + state.round + ' rounds') + '</p><h2 class="c' + w + '">' + esc(state.players[w].name) + ' wins!</h2>';
    overlay.innerHTML = '<div class="card">' + head +
      '<table class="stats"><thead><tr><th></th><th class="c0">' + esc(a.name) + '</th><th class="c1">' + esc(b.name) + '</th></tr></thead><tbody>' +
      '<tr><td>Hearts left</td><td>' + a.hearts + '</td><td>' + b.hearts + '</td></tr>' +
      '<tr><td>Rounds won</td><td>' + a.wins + '</td><td>' + b.wins + '</td></tr>' +
      '<tr><td>Jackpots</td><td>' + a.jackpots + '</td><td>' + b.jackpots + '</td></tr>' +
      '<tr><td>Best spin</td><td>' + money(a.best) + '</td><td>' + money(b.best) + '</td></tr>' +
      '<tr><td>Total won</td><td>' + money(a.won) + '</td><td>' + money(b.won) + '</td></tr></tbody></table>' +
      '<div class="bags">' + bagHTML(0, { active: w === 0 }) + bagHTML(1, { active: w === 1 }) + '</div>' +
      (Net.active() ? '<button class="btn hot" type="button" id="btn-leave">Back to the title</button>' : '<div class="two"><button class="btn" type="button" id="btn-leave">Exit</button><button class="btn hot" type="button" id="btn-rematch">Rematch</button></div>') + '</div>';
    overlay.dataset.kind = 'over'; overlay.hidden = false;
    Sound.fanfare(); FX.confetti(90); FX.coins(50);
  }

  };

    overlay.dataset.kind = 'paytable'; overlay.hidden = false;
  }


  /* ---------- how to play: a deck of cards, one idea each ---------- */

  /* ---------- flow ---------- */
  function startGame(names, first, pool, bans, tiers, ai) {
    ++ui.token;
    state = E.newGame(names, grng, first, pool, bans);
    if (tiers) state.augTiers = tiers;
    if (Net.active()) state.net = true;
    if (ai) state.ai = { level: ai.level, fam: AI.chooseFam(ai.level, state.pool, rng), news: null };
    ui.augSel = null;
    ui.hearts = state.players.map(p => p.hearts);
    ui.sel = null; ui.fresh = null; ui.busy = false; ui.fast = false; ui.turnDone = false; ui.confirm = false; ui.peek = false; ui.dealt = true;
    view = 'game';
    FX.clear();
    overlay.hidden = true; overlay.innerHTML = '';
    save();
    renderGame();
  }

  function renderGame() {
    $('#title').hidden = view !== 'title';
    $('#game').hidden = view !== 'game';
    if (view !== 'game') { FX.ambient(null); renderTitle(); const c = $('#coach'); if (c) { c.hidden = true; $('#spot').hidden = true; } return; }
    Tut.before();
    aiBefore();
    renderPlates();
    if (state.phase === 'shop' && Net.active() && E.shopDone(state, Net.seat())) renderWait();
    else if (state.phase === 'shop') renderShop();
    else if (state.phase === 'spin') renderSpin();
    else {
      // clash or over, reached by resuming a saved game: show the last screen behind the overlay
      const who = state.spin ? state.spin.order[1] : 0;
      const turn = state.spin && state.spin.results[who], last = turn && turn.spins[turn.spins.length - 1];
      $('#marquee').innerHTML = '<span>Round ' + state.round + '</span>';
      $('#screen').innerHTML = '<div class="reels" id="reels"></div>';
      reels = new Reels($('#reels'));
      if (last) reels.show(last.cells, state.players[who].gem, last.frozenCols || []);
      $('#mid').innerHTML = ''; $('#below').innerHTML = ''; $('#actions').innerHTML = '';
      if (state.phase === 'clash') showClash(); else showOver();
    }
    Tut.on('render');
  }

  function leave() {
    ++ui.token; Net.quit(); ui.busy = false; ui.fast = false; Sound.music.stop(); FX.rain(false); if (ui.musicTimer) { clearTimeout(ui.musicTimer); ui.musicTimer = 0; }

    const c = $('#coach'); if (c) { c.hidden = true; $('#spot').hidden = true; }
    const tst = $('#toast'); if (tst) { tst.hidden = true; tst.innerHTML = ''; }
    overlay.hidden = true; overlay.innerHTML = '';
    FX.clear();
    view = 'title';
    delete $('#app').dataset.theme;
    renderGame();
  }

  function resume(s) {
    ++ui.token;

      grng = seeded(net.seed); srngs = [null, null]; net.applied = [{}, {}]; state = null; draft = null; view = 'title';
      for (const a of net.log) apply(a, false);
      replayingNow = false;
      if (state) { ui.hearts = state.players.map(p => p.hearts); if (state.phase === 'clash' && state.clash && state.clash.winner >= 0) ui.hearts[1 - state.clash.winner] += state.clash.dmg; view = 'game'; overlay.hidden = true; overlay.innerHTML = ''; FX.clear(); renderGame(); }
      else if (draft) { view = 'title'; renderGame(); renderDraft(); }
    }
    /* ---- entry points ---- */
    function create(name) {
      Sound.ensure(); name = (name || 'Player 1').slice(0, 10).replace(/[<>|,]/g, '');
      net = { code: code4(), broker: undefined, shown: null, seed: 1 + Math.floor(Math.random() * 2000000000), seat: 0, names: [name, ''], log: [], shops: [[], []], applied: [{}, {}], ready: null, peerReady: null, started: false };
      peerSeen = false; queue = []; store(); connect('host');
    }
    function join(name, code) {
      Sound.ensure(); name = (name || 'Player 2').slice(0, 10).replace(/[<>|,]/g, ''); code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
      if (code.length < 4) return false;
      const broker = code.length === 5 ? +code[4] : undefined;
      if (code.length === 5 && !(broker >= 0 && broker < Relay.BROKERS.length)) return false;
      net = { code: code.slice(0, 4), broker, shown: code, seed: null, seat: 1, names: ['', name], log: [], shops: [[], []], applied: [{}, {}], ready: null, peerReady: null, started: false };
      peerSeen = false; queue = []; store(); connect('guest'); return true;
    }
    function start() {   // the host starts: the names go into the log so both phones agree on them
      if (!net || net.seat !== 0 || !net.names[1]) return;
      Sound.tap();
      const a = 'g' + net.names[0] + '|' + net.names[1];
      did(a); apply(a, true);
    }
    function resume(sv) {
      Sound.ensure();
      net = { code: sv.code, broker: typeof sv.broker === 'number' ? sv.broker : undefined, shown: sv.shown || null, seed: sv.seed, seat: sv.seat, names: sv.names, log: sv.log || [], shops: Array.isArray(sv.shops) && sv.shops.length === 2 ? sv.shops : [[], []], applied: [{}, {}], ready: null, peerReady: null, started: !!(sv.log && sv.log.length), over: !!sv.over };
      peerSeen = false; queue = [];
      if (net.started) { rebuild(); listen(); } else connect(net.seat === 0 ? 'host' : 'guest');
    }
    function quit() {
      if (!net) return;
      unsub.forEach(u => { try { u(); } catch (e) {} }); unsub = []; clearInterval(lobbyTick); clearTimeout(drainTimer);
      if (nr) { try { nr.leave(); } catch (e) {} } nr = null;
      net = null; queue = []; peerSeen = false; grng = Math.random; store();
    }
    /* May this tap go through? Only your own turn's controls, plus anything that is just looking. */
    function allows(t) {
      if (!net) return true;
      if (t.closest('#lobby-cancel, #lobby-start, [data-open], #sheet-close, .sound-btn, .fx-btn, #btn-leave, #btn-peek, [data-plate], #tut-next, #tut-back, #tut-done, #tut-close, #resume-net')) return true;
      if (t === overlay) return true;
      if (overlay.dataset.kind === 'draft' && !overlay.hidden) { if (t.closest('#draft-play')) return true; return !!(draft && draft.who === net.seat && !draft.pool); }
      if (!state) return false;
      if (overlay.dataset.kind === 'clash' && !overlay.hidden) return true;
      if (overlay.dataset.kind === 'over' && !overlay.hidden) return true;
      if (overlay.dataset.kind === 'augs' || overlay.dataset.kind === 'paytable' || overlay.dataset.kind === 'builds') return true;
      if (state.phase === 'shop') return !E.shopDone(state, net.seat);
      if (state.phase === 'spin') { const mine = E.spinner(state) === net.seat; if (t.closest('#btn-spin')) return mine || ui.turnDone; if (t.closest('#lever')) return mine; return mine || ui.turnDone; }
      return true;
    }
    function debug() { return net ? { seat: net.seat, log: net.log.length, last: net.log.slice(-3), shops: net.shops.map(x => x.length), queue: queue.slice(), ready: net.ready, peerReady: net.peerReady, busy: ui.busy, turnDone: ui.turnDone, idle: idle(), phase: state ? state.phase : null } : null; }
    return { active, seat, replaying, did, apply, drain, ready, allows, watching, peerHere, create, join, start, resume, quit, saved, debug, srng: () => srng(net.seat) };
  })();

  /* ---------- events ---------- */
  document.addEventListener('pointerdown', () => Sound.ensure(), { passive: true });
  document.addEventListener('touchend', () => Sound.ensure(), { passive: true });
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('#coach-next')) { Sound.tap(); if (Tut.atEnd()) { Tut.quit(); return; } Tut.advance(); return; }
    if (t.closest('#coach-quit')) { Tut.quit(); return; }
    if (!Tut.allows(t)) return;
    if (!Net.allows(t)) return;
    if (t.closest('#tutorial-btn')) { Sound.ensure(); Sound.tap(); Tut.start(); return; }
    if (t.closest('#lobby-cancel')) { Sound.tap(); Net.quit(); overlay.hidden = true; overlay.innerHTML = ''; renderTitle(); return; }
    if (t.closest('#lobby-start')) { Net.start(); return; }
    if (t.closest('#resume-net')) { const sv = Net.saved(); if (sv) Net.resume(sv); return; }
    if (t.closest('[data-open="paytable"]')) { Sound.tap(); openPaytable(); return; }
    if (t.closest('[data-open="builds"]')) { Sound.tap(); openBuilds(); return; }
    if (t.closest('[data-open="tutorial"]')) { Sound.tap(); openTutorial(0); return; }
    if (t.closest('#tut-next')) { Sound.tap(); openTutorial(tutAt + 1); return; }
    if (t.closest('#tut-back')) { Sound.tap(); openTutorial(tutAt - 1); return; }
    if (t.closest('#tut-done') || t.closest('#tut-close')) { Sound.tap(); overlay.hidden = true; overlay.innerHTML = ''; return; }
    if (t.closest('[data-plate]') && state && view === 'game' && overlay.hidden) { Sound.tap(); openAugments(+t.closest('[data-plate]').dataset.plate); return; }
    if (t.closest('.sound-btn')) { const m = Sound.toggle(); document.querySelectorAll('.sound-btn').forEach(b => { b.textContent = m ? 'Sound off' : 'Sound on'; }); if (!m) Sound.tap(); return; }
    if (t.closest('.fx-btn')) { const lite = document.documentElement.dataset.fx !== 'lite'; if (lite) document.documentElement.dataset.fx = 'lite'; else delete document.documentElement.dataset.fx; try { localStorage.setItem('jackpot-duel-fx', lite ? 'lite' : 'full'); } catch (e) {} FX.setLite(lite); fxLabels(); if (view === 'game' && state && !ui.busy) renderGame(); Sound.tap(); return; }
    if (t.closest('#sheet-close')) { overlay.hidden = true; overlay.innerHTML = ''; return; }
    if (t === overlay && (overlay.dataset.kind === 'paytable' || overlay.dataset.kind === 'builds')) { overlay.hidden = true; overlay.innerHTML = ''; return; }
    if (t.closest('#btn-leave')) { leave(); return; }
    if (overlay.dataset.kind === 'aug' && !overlay.hidden) {
      const a = t.closest('[data-aug]'); if (a) { Sound.tap(); ui.augSel = a.dataset.aug; renderAugPick(); return; }
      if (t.closest('#aug-take')) { takeAug(); return; }
      return;
    }
    if (overlay.dataset.kind === 'draft' && !overlay.hidden) {
      const b = t.closest('[data-ban]'); if (b && !b.disabled) { draftBan(b.dataset.ban); return; }
      if (t.closest('#draft-skip')) { draftSkip(); return; }
      if (t.closest('#draft-back')) { draft = null; overlay.hidden = true; overlay.innerHTML = ''; return; }
      if (t.closest('#draft-play')) { draftPlay(); return; }
      return;
    }
    if (t.closest('#btn-rematch')) { Sound.ensure(); openDraft(state.players.map(p => p.name), !state.first, state.ai ? { level: state.ai.level } : null); return; }
    if (t.closest('#clash-next')) { if (state.phase !== 'clash') return; if (Net.active()) Net.ready(); else afterClash(); return; }
    if (t.closest('#resume-btn')) { const s = load(); if (!s) return; Sound.ensure(); resume(s); renderGame(); return; }
    if (t.closest('#demo-btn')) { demoSpin(); return; }
    if (view === 'title') { if (demoBusy && t.closest('#demo-cab')) hurry(); return; }
    if (!state) return;
    if (overlay.hidden === false) { if (overlay.dataset.kind === 'clash') hurry(); return; }

    if (state.phase === 'shop') {
      const o = t.closest('[data-offer]');
      if (o) { const i = +o.dataset.offer; Sound.tap(); ui.confirm = false; ui.sellSel = null; if (ui.sel === i) { doBuy(); return; } ui.sel = i; renderShop(); Tut.on('select', i); return; }
      if (t.closest('#shredder') && !ui.peek) { Sound.tap(); ui.confirm = false; ui.sel = null; ui.sellSel = ui.sellSel && ui.sellSel.k === 'cards' ? null : { k: 'cards', t: 0 }; renderShop(); if (ui.sellSel) Tut.on('selectCards'); return; }
      const sl = t.closest('[data-sell]');
      if (sl) { Sound.tap(); ui.confirm = false; ui.sel = null; const v = sl.dataset.sell; ui.sellSel = v === 'cards' ? { k: 'cards', t: 0 } : { k: v.split(':')[0], t: +v.split(':')[1] }; renderShop(); if (v === 'cards') Tut.on('selectCards'); return; }
      if (t.closest('#btn-sell')) { doSell(); return; }
      if (t.closest('#btn-shred')) { doShred(); return; }
      if (t.closest('#btn-unsell')) { ui.sellSel = null; renderShop(); return; }
      if (t.closest('#btn-buy')) { doBuy(); return; }
      if (t.closest('#btn-hold')) { doHold(); return; }
      if (t.closest('#btn-reroll')) { doReroll(); return; }
      if (t.closest('#btn-upgrade')) { doUpgrade(); return; }
      if (t.closest('#btn-done')) { doDone(); return; }
      if (t.closest('#btn-peek')) { ui.peek = !ui.peek; ui.sellSel = null; Sound.tap(); renderShop(); return; }
      return;
    }
    if (t.closest('#lever')) { const l = $('#lever'); if (l.dataset.swiped) return; if (ui.busy) { hurry(); return; } if (!ui.turnDone) { l.classList.remove('hint'); void l.offsetWidth; l.classList.add('hint'); } return; }
    if (t.closest('#btn-spin')) { if (ui.busy) hurry(); else if (ui.turnDone) afterTurn(); else doTurn(); return; }
    if (ui.busy && t.closest('#cab, #mid')) hurry();
  });

  /* The setup form: two players, or one against the computer at a chosen level. The choice is remembered. */
  const setup = { mode: '2p', level: 'medium' };
  try { const sv = JSON.parse(localStorage.getItem('jackpot-duel-setup')); if (sv && (sv.mode === '2p' || sv.mode === 'ai' || sv.mode === 'net')) setup.mode = sv.mode; if (sv && AI.LEVELS[sv.level]) setup.level = sv.level; } catch (e) {}
  function renderSetup() {
    const ai = setup.mode === 'ai', online = setup.mode === 'net';
    document.querySelectorAll('.modebtn').forEach(b => { b.classList.toggle('on', b.dataset.mode === setup.mode); b.setAttribute('aria-selected', b.dataset.mode === setup.mode ? 'true' : 'false'); });
    document.querySelectorAll('.lvl').forEach(b => b.classList.toggle('on', b.dataset.level === setup.level));
    $('#field-p1').hidden = ai || online; $('#field-ai').hidden = !ai; $('#netrow').hidden = !online;
    $('#name0').previousElementSibling.textContent = online ? 'Your name' : 'Player one';
    const bl = $('#lvl-blurb'); bl.hidden = !ai; if (ai) { const L = AI.LEVELS[setup.level]; bl.innerHTML = '<b>' + L.name + '</b> · ' + L.blurb; }
    $('#start-btn').textContent = ai ? 'Play vs ' + AI.LEVELS[setup.level].name : 'Play'; $('#start-btn').hidden = online;
    try { localStorage.setItem('jackpot-duel-setup', JSON.stringify(setup)); } catch (e) {}
  }
  $('#setup-form').addEventListener('click', e => {
    const m = e.target.closest('.modebtn'), l = e.target.closest('.lvl');
    if (e.target.closest('#net-create')) { Net.create($('#name0').value.trim() || 'Player 1'); return; }
    if (e.target.closest('#net-join')) { if (!Net.join($('#name0').value.trim() || 'Player 2', $('#net-code').value)) { Sound.nope(); $('#net-code').focus(); } return; }
    if (m) { setup.mode = m.dataset.mode; Sound.tap(); renderSetup(); }
    if (l) { setup.level = l.dataset.level; Sound.tap(); renderSetup(); }
  });
  renderSetup();
  $('#setup-form').addEventListener('submit', e => {
    e.preventDefault();
    const n0 = $('#name0').value.trim() || 'Player 1';
    Sound.ensure();
    if (setup.mode === 'net') { if (document.activeElement === $('#net-code') || $('#net-code').value) { if (!Net.join(n0 || 'Player 2', $('#net-code').value)) Sound.nope(); } else Net.create(n0); return; }
    if (setup.mode === 'ai') { const bot = AI.LEVELS[setup.level].name; openDraft([n0 === bot ? n0 + ' 2' : n0, bot], Math.random() < 0.5, { level: setup.level }); return; }
    const n1 = $('#name1').value.trim() || 'Player 2';
    openDraft([n0, n1 === n0 ? n1 + ' 2' : n1], Math.random() < 0.5);
  });

  /* ---------- the draft: each player bans one build, then eight are drawn ---------- */
  let draft = null;
  function openDraft(names, first, ai) {
    draft = { names, first, bans: [], pool: null, who: ai ? 0 : first ? 1 : 0, ai: ai || null };
    renderDraft();
  }
  function renderDraft() {
    const d = draft, banning = !d.pool;
    const tile = f => {
      const banned = d.bans.indexOf(f) >= 0, inPool = d.pool && d.pool.indexOf(f) >= 0, out = d.pool && !inPool && !banned;
      return '<button type="button" class="dtile ' + f + (banned ? ' banned' : '') + (inPool ? ' in' : '') + (out ? ' out' : '') + '" data-ban="' + f + '"' + (banning && !banned && !(d.ai && d.who === 1) && !theirs ? '' : ' disabled') + '><span class="dicon">' + icon(FAM_ICON[f]) + '</span><b>' + FAM_NAME[f] + '</b>' + (banned ? '<i class="dmark">✕</i>' : '') + '</button>';
    };
    let head;
    const theirs = banning && d.net && d.who !== Net.seat();
    if (banning && d.ai && d.who === 1) { head = '<h2><span class="who1">' + esc(d.names[1]) + '</span> is banning…</h2><p class="dsub">It stays out of this game for both of you.</p>'; setTimeout(() => { if (draft === d && !d.pool && d.who === 1) draftBan(AI.ban(d.ai.level, rng)); }, 900); }
    else if (theirs) head = '<h2><span class="who' + d.who + '">' + esc(d.names[d.who]) + '</span> is banning…</h2><p class="dsub">It stays out of this game for both of you.</p>';
    else if (banning) head = '<h2><span class="who' + d.who + '">' + esc(d.names[d.who]) + '</span>, ban one build</h2><p class="dsub">' + (d.ai ? esc(d.names[1]) + ' bans one after you. ' : '') + 'It stays out of this game for both of you.</p>';
    else head = '<h2>Tonight’s machines</h2><p class="dsub">Eight builds drawn from the fourteen left. Pick one and go all in.</p><p class="tiersched">Augments: ' + CFG.augRounds.map((r, i) => '<span class="tier-' + d.tiers[i] + '">round ' + r + ' ' + TIER_NAME[d.tiers[i]] + '</span>').join(' · ') + '</p>';
    overlay.innerHTML = '<div class="card draft">' + head + '<div class="dgrid">' + E.FAMS.map(tile).join('') + '</div>' +
      (banning ? '<div class="two"><button class="btn" type="button" id="draft-skip"' + ((d.ai && d.who === 1) || theirs || (d.net && d.who === 1) ? ' disabled' : '') + '>Skip bans</button>' + (d.net ? '' : '<button class="btn" type="button" id="draft-back">Back</button>') + '</div>'
        : '<button class="btn hot big" type="button" id="draft-play">Play</button>') + '</div>';
    overlay.dataset.kind = 'draft'; overlay.hidden = false;
  }
  function draftBan(f) {
    const d = draft; if (!d || d.bans.length >= 2 || d.bans.indexOf(f) >= 0) return;
    if (Net.active()) { const a = 'B' + E.FAMS.indexOf(f); Net.did(a); Net.apply(a, true); return; }
    d.bans.push(f); d.who = 1 - d.who; Sound.crush();
    if (d.bans.length === 2) { d.pool = E.drawPool(grng, d.bans); d.tiers = rollTiers(); Sound.fanfare(); }
    renderDraft();
  }
  function rollTiers() { return CFG.augRounds.map((r, i) => { const o = CFG.augOdds[i], x = grng() * 100; return x < o[0] ? 'c' : x < o[0] + o[1] ? 'r' : 'l'; }); }
  function draftSkip() { const d = draft; if (Net.active()) { Net.did('K'); Net.apply('K', true); return; } d.pool = E.drawPool(grng, d.bans); d.tiers = rollTiers(); Sound.fanfare(); renderDraft(); }
  function draftPlay() { const d = draft; draft = null; if (d.net) { overlay.hidden = true; overlay.innerHTML = ''; renderGame(); return; } startGame(d.names, d.first, d.pool, d.bans, d.tiers, d.ai); }

  /* ---------- boot ---------- */
  document.querySelectorAll('.cab').forEach(addBulbs);
  document.querySelectorAll('.sound-btn').forEach(b => { b.textContent = Sound.muted ? 'Sound off' : 'Sound on'; });
  function fxLabels() { const lite = document.documentElement.dataset.fx === 'lite'; document.querySelectorAll('.fx-btn').forEach(b => { b.textContent = lite ? 'Effects: lite' : 'Effects: full'; }); }
  try { if (localStorage.getItem('jackpot-duel-fx') === 'lite') { document.documentElement.dataset.fx = 'lite'; FX.setLite(true); } } catch (e) {}
  fxLabels();
  function boot(data) {
    if (data && data.state && (data.state.v >= 3 && data.state.v <= 5)) { if (!data.state.pool) data.state.pool = E.FAMS.slice(0, 8); if (!data.state.augTiers) data.state.augTiers = ['c', 'c', 'c']; resume(data.state); view = data.view || 'game'; }
    renderGame();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ state, view: state ? view : 'title' })); } catch (e) {}
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
  window.JackpotDuel = { get state() { return state; }, Engine: E, hurry, busy: () => ui.busy, tutAllow: (el) => Tut.allows(el), musicOn: () => Sound.music.on, musicTest: (fam) => { Sound.ensure(); Sound.music.stop(); Sound.music.start(fam); return new Promise(r => setTimeout(() => { const e = Sound.music.errors || 0, le = Sound.music.lastError; Sound.music.stop(); Sound.music.errors = 0; r([e, le]); }, 1200)); }, mute: () => { if (!Sound.muted) Sound.toggle(); }, jpShow: (fam, ms) => jackpotShow(fam, 'test', ms || 3000), testHurry: () => { ui.testHurry = true; }, net: () => Net.debug() };
})();
</script>
</body></html>
